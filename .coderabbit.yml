# 👇 CodeRabbit Configuration File
# Place this in the root of your repository as `.coderabbit.yaml`

version: 1

# --- GENERAL SETTINGS ---
settings:
  # Auto-review all Pull Requests (PRs)
  review:
    auto_review: true             # Automatically trigger AI review when a PR is opened or updated
    review_level: standard        # Options: "standard", "deep"
    max_comments: 15              # Limit number of comments per review
    language: en                  # Review language
    tone: professional            # Options: "professional", "friendly", "concise"

  # Automatically resolve conversations when PR is updated
  auto_resolve: true

  # Skip small PRs
  min_lines_changed: 5

  # Comment style
  comment_format:
    include_code_snippet: true
    include_suggestion: true
    concise_summary: true

# --- FILE FILTERS ---
filters:
  # Ignore specific files or folders from review
  exclude:
    - "docs/**"
    - "*.md"
    - "*.yaml"
    - "*.yml"
    - "README.md"
    - "LICENSE"
    - ".github/**"
    - "argocd-apps/**"

# --- CUSTOM RULES ---
rules:
  # Enforce commit message format
  commits:
    pattern: "^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\\(.*\\))?: .+$"
    message: "Commit message must follow Conventional Commit format (e.g., 'feat: add login API')."

  # Enforce code practices
  code:
    - id: no-console-log
      description: "Avoid using console.log in production code."
      severity: medium
      match: "console\\.log"

    - id: prefer-const
      description: "Use 'const' instead of 'let' when variable is never reassigned."
      severity: low
      match: "\\blet\\b"

# --- REVIEW TRIGGERS ---
triggers:
  pull_request:
    on_open: true
    on_update: true
    on_reopen: true
    on_push: true

# --- MERGE BLOCKING RULES ---
blocking_rules:
  - id: test-coverage
    description: "Require unit test coverage >= 80%"
    condition: "coverage < 80"
    action: warn

  - id: linter
    description: "Ensure linting passes"
    condition: "lint_failed == true"
    action: fail
