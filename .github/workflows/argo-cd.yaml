name: Build and Deploy with ArgoCD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    paths-ignore:
      - 'k8s/**'
      - 'argocd-apps/**'
      - '**.md'
      - '.gitignore'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'k8s/**'
      - 'argocd-apps/**'
      - '**.md'
      - '.gitignore'
    
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'dev'

  # ✅ NEW: Trigger when new branches are created
  create:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ashwini73/todolist-app
  MANIFEST_REPO: ashwinimhasrup/argocd-TodoList

jobs:
  # ✅ NEW JOB: Auto-update ArgoCD targetRevision for new feature/hotfix branches (DEV)
  update-argocd-dev-branch:
    runs-on: self-hosted
    if: |
      github.event_name == 'create' && 
      (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    steps:
      - name: Extract new branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "🎯 New dev branch detected: ${BRANCH_NAME}"

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ steps.extract-branch.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update ArgoCD dev app targetRevision
        run: |
          echo "📝 Updating dev-app.yaml to track ${{ steps.extract-branch.outputs.branch }}"
          yq eval '.spec.source.targetRevision = "${{ steps.extract-branch.outputs.branch }}"' -i argocd-apps/dev-app.yaml

      - name: Commit and push ArgoCD app update
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes needed"
          else
            git add argocd-apps/dev-app.yaml
            git commit -m "chore: update dev targetRevision to ${{ steps.extract-branch.outputs.branch }} [skip ci]"
            git push origin ${{ steps.extract-branch.outputs.branch }}
            echo "✅ ArgoCD dev will now sync from ${{ steps.extract-branch.outputs.branch }}"
          fi

  # ✅ NEW JOB: Auto-update ArgoCD targetRevision for new release branches (STAGING)
  update-argocd-staging-branch:
    runs-on: self-hosted
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Extract new release branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "🎯 New release branch detected: ${BRANCH_NAME}"

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ steps.extract-branch.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update ArgoCD staging app targetRevision
        run: |
          echo "📝 Updating staging-app.yaml to track ${{ steps.extract-branch.outputs.branch }}"
          yq eval '.spec.source.targetRevision = "${{ steps.extract-branch.outputs.branch }}"' -i argocd-apps/staging-app.yaml

      - name: Commit and push ArgoCD app update
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes needed"
          else
            git add argocd-apps/staging-app.yaml
            git commit -m "chore: update staging targetRevision to ${{ steps.extract-branch.outputs.branch }} [skip ci]"
            git push origin ${{ steps.extract-branch.outputs.branch }}
            echo "✅ ArgoCD staging will now sync from ${{ steps.extract-branch.outputs.branch }}"
          fi

  build-for-pr:
    name: pull_request (CI only for PR)
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    # This job runs for ALL PRs to ensure CodeRabbit and CI checks work

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}

      - name: CI Only Message
        run: |
          echo "✅ Docker image built successfully for PR #${{ github.event.pull_request.number }}"
          echo "🧪 Code review and testing is done."

  build-and-push-dev:
    runs-on: self-hosted
    if: |
      startsWith(github.ref, 'refs/heads/hotfix/') ||
      startsWith(github.ref, 'refs/heads/feature/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "📌 Source branch: ${BRANCH_NAME}"

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  update-manifests-dev:
    needs: build-and-push-dev
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo (same branch as source)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-dev.outputs.branch-name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Dev manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-dev.outputs.image-tag }}"' -i k8s/dev/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-dev.outputs.branch-name }}"' -i argocd-apps/dev-app.yaml

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes detected"
          else
            git add k8s/dev/nodetodo.yaml argocd-apps/dev-app.yaml
            git commit -m "chore: update dev nodetodo image to ${{ needs.build-and-push-dev.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-dev.outputs.branch-name }}
          fi

  build-and-push-qa:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/develop'
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest

  update-manifests-qa:
    needs: build-and-push-qa
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-qa.outputs.branch-name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update QA manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-qa.outputs.image-tag }}"' -i k8s/qa/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-qa.outputs.branch-name }}"' -i argocd-apps/qa-app.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
          else
            git add k8s/qa/nodetodo.yaml argocd-apps/qa-app.yaml
            git commit -m "chore: update QA nodetodo image to ${{ needs.build-and-push-qa.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-qa.outputs.branch-name }}
          fi

  build-and-push-staging:
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
      
      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest

  update-manifests-staging:
    needs: build-and-push-staging
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-staging.outputs.branch-name }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Update Staging manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-staging.outputs.image-tag }}"' -i k8s/staging/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-staging.outputs.branch-name }}"' -i argocd-apps/staging-app.yaml
      
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
          else
            git add k8s/staging/nodetodo.yaml argocd-apps/staging-app.yaml
            git commit -m "chore: update staging nodetodo image to ${{ needs.build-and-push-staging.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-staging.outputs.branch-name }}
          fi

  build-and-push-prod:
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      version-tag: ${{ steps.extract-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version tag
        id: extract-tag
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "🏷️ Version tag: ${VERSION_TAG}"
      
      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-manifests-prod:
    needs: build-and-push-prod
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo (main branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Update Prod manifest (nodetodo only)
        run: |
          echo "🚀 Updating production to version ${{ needs.build-and-push-prod.outputs.version-tag }}"
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-prod.outputs.image-tag }}"' -i k8s/prod/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-prod.outputs.version-tag }}"' -i argocd-apps/prod-app.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
          else
            git add k8s/prod/nodetodo.yaml argocd-apps/prod-app.yaml
            git commit -m "chore: update prod to ${{ needs.build-and-push-prod.outputs.version-tag }} (image: ${{ needs.build-and-push-prod.outputs.image-tag }}) [skip ci]"
            git push origin main
            echo "✅ Production updated to ${{ needs.build-and-push-prod.outputs.version-tag }}"
          fi
