apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todolist-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ashwinimhasrup/argocd-TodoList.git
    targetRevision: release/v1.1 # This will be updated by pipeline
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
