name: Build and Deploy with ArgoCD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    types: [opened, synchronize, reopened]
    
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'dev'

  # Trigger when new branches are created
  create:
    branches:
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ashwini73/todolist-app
  MANIFEST_REPO: ashwinimhasrup/argocd-TodoList

jobs:
  # Auto-create and setup manifest repo branches for feature/release/hotfix
  setup-manifest-branch:
    runs-on: self-hosted
    if: |
      github.event_name == 'create' && (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    steps:
      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "🎯 New branch detected: ${BRANCH_NAME}"

      - name: Checkout manifests repo (main)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Create matching branch in manifest repo
        run: |
          BRANCH_NAME="${{ steps.extract-branch.outputs.branch }}"
          
          # Check if branch already exists
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "✅ Branch ${BRANCH_NAME} already exists in manifest repo"
          else
            echo "🔨 Creating new branch ${BRANCH_NAME} in manifest repo"
            git checkout -b "${BRANCH_NAME}"
            git push origin "${BRANCH_NAME}"
            echo "✅ Branch ${BRANCH_NAME} created successfully"
          fi

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update ArgoCD app targetRevision for the branch
        run: |
          BRANCH_NAME="${{ steps.extract-branch.outputs.branch }}"
          git checkout "${BRANCH_NAME}"
          
          # Update appropriate ArgoCD app based on branch type
          if [[ "${BRANCH_NAME}" == feature/* ]] || [[ "${BRANCH_NAME}" == hotfix/* ]]; then
            echo "📝 Updating dev-app.yaml to track ${BRANCH_NAME}"
            yq eval '.spec.source.targetRevision = "'${BRANCH_NAME}'"' -i argocd-apps/dev-app.yaml
            APP_FILE="argocd-apps/dev-app.yaml"
            APP_NAME="dev-app"
          elif [[ "${BRANCH_NAME}" == release/* ]]; then
            echo "📝 Updating staging-app.yaml to track ${BRANCH_NAME}"
            yq eval '.spec.source.targetRevision = "'${BRANCH_NAME}'"' -i argocd-apps/staging-app.yaml
            APP_FILE="argocd-apps/staging-app.yaml"
            APP_NAME="staging-app"
          fi

          # Commit and push if changes were made
          if git diff --quiet; then
            echo "⚠️ No changes needed"
          else
            git add "${APP_FILE}"
            git commit -m "chore: setup ArgoCD to track ${BRANCH_NAME} [skip ci]"
            git push origin "${BRANCH_NAME}"
            echo "✅ ArgoCD configured to sync from ${BRANCH_NAME}"
            echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          fi
        id: update-argocd-app

      - name: Refresh ArgoCD Application
        if: steps.update-argocd-app.outputs.app_name != ''
        run: |
          # Install ArgoCD CLI if not present
          if ! command -v argocd &> /dev/null; then
            echo "📥 Installing ArgoCD CLI..."
            mkdir -p $HOME/.local/bin
            curl -sSL -o $HOME/.local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x $HOME/.local/bin/argocd
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            export PATH=$HOME/.local/bin:$PATH
          fi
          
          # Login to ArgoCD
          argocd login ${{ secrets.ARGO_SERVER_URL }} \
            --username ${{ secrets.ARGO_USER }} \
            --password ${{ secrets.ARGO_PASS }} \
            --insecure
          
          # Refresh the application to pick up new targetRevision
          echo "🔄 Refreshing ArgoCD app: ${{ steps.update-argocd-app.outputs.app_name }}"
          argocd app get ${{ steps.update-argocd-app.outputs.app_name }} --refresh
          
          echo "✅ ArgoCD application refreshed successfully"

  build-for-pr:
    name: pull_request (CI only for PR)
    runs-on: self-hosted
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}

      - name: CI Only Message
        run: |
          echo "✅ Docker image built successfully for PR #${{ github.event.pull_request.number }}"
          echo "🧪 Code review and testing is done."

  build-and-push-dev:
    runs-on: self-hosted
    if: |
      (startsWith(github.ref, 'refs/heads/hotfix/') && github.event_name == 'push') ||
      (startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "📌 Source branch: ${BRANCH_NAME}"

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  update-manifests-dev:
    needs: build-and-push-dev
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo (same branch as source)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-dev.outputs.branch-name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Dev manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-dev.outputs.image-tag }}"' -i k8s/dev/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-dev.outputs.branch-name }}"' -i argocd-apps/dev-app.yaml

      - name: Commit and push changes
        id: commit-changes
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add k8s/dev/nodetodo.yaml argocd-apps/dev-app.yaml
            git commit -m "chore: update dev nodetodo image to ${{ needs.build-and-push-dev.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-dev.outputs.branch-name }}
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh ArgoCD Application
        if: steps.commit-changes.outputs.changed == 'true'
        run: |
          if ! command -v argocd &> /dev/null; then
            curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /tmp/argocd
            sudo mv /tmp/argocd /usr/local/bin/argocd
          fi
          
          argocd login ${{ secrets.ARGO_SERVER_URL }} \
            --username ${{ secrets.ARGO_USER }} \
            --password ${{ secrets.ARGO_PASS }} \
            --insecure
          
          argocd app get dev-app --refresh
          echo "✅ ArgoCD dev-app refreshed"

  build-and-push-qa:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest

  update-manifests-qa:
    needs: build-and-push-qa
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-qa.outputs.branch-name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update QA manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-qa.outputs.image-tag }}"' -i k8s/qa/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-qa.outputs.branch-name }}"' -i argocd-apps/qa-app.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
          else
            git add k8s/qa/nodetodo.yaml argocd-apps/qa-app.yaml
            git commit -m "chore: update QA nodetodo image to ${{ needs.build-and-push-qa.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-qa.outputs.branch-name }}
          fi

  build-and-push-staging:
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "📌 Building for staging from: ${BRANCH_NAME}"
      
      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest

  update-manifests-staging:
    needs: build-and-push-staging
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ needs.build-and-push-staging.outputs.branch-name }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Update Staging manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-staging.outputs.image-tag }}"' -i k8s/staging/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "${{ needs.build-and-push-staging.outputs.branch-name }}"' -i argocd-apps/staging-app.yaml
      
      - name: Commit and push
        id: commit-changes
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add k8s/staging/nodetodo.yaml argocd-apps/staging-app.yaml
            git commit -m "chore: update staging nodetodo image to ${{ needs.build-and-push-staging.outputs.image-tag }} [skip ci]"
            git push origin ${{ needs.build-and-push-staging.outputs.branch-name }}
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Refresh ArgoCD Application
        if: steps.commit-changes.outputs.changed == 'true'
        run: |
          if ! command -v argocd &> /dev/null; then
            curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /tmp/argocd
            sudo mv /tmp/argocd /usr/local/bin/argocd
          fi
          
          argocd login ${{ secrets.ARGO_SERVER_URL }} \
            --username ${{ secrets.ARGO_USER }} \
            --password ${{ secrets.ARGO_PASS }} \
            --insecure
          
          argocd app get staging-app --refresh
          echo "✅ ArgoCD staging-app refreshed"

  build-and-push-prod:
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set image tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-manifests-prod:
    needs: build-and-push-prod
    runs-on: self-hosted
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Install yq (no sudo)
        run: |
          mkdir -p $HOME/.local/bin
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Update Prod manifest (nodetodo only)
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "nodetodo").image) = "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-prod.outputs.image-tag }}"' -i k8s/prod/nodetodo.yaml
          yq eval '.spec.source.targetRevision = "main"' -i argocd-apps/prod-app.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "⚠️ No changes"
          else
            git add k8s/prod/nodetodo.yaml argocd-apps/prod-app.yaml
            git commit -m "chore: update prod nodetodo image to ${{ needs.build-and-push-prod.outputs.image-tag }} [skip ci]"
            git push origin main
          fi
