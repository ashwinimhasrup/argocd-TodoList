apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitflow-autodeploy
  namespace: argocd
spec:
  generators:
    - scmProvider:
        github:
          organization: my-org
          repository: my-repo
        filters:
          branches:
            - pattern: "^(main|develop)$"
            - pattern: "^feature/.*"
            - pattern: "^release/.*"
            - pattern: "^hotfix/.*"
          tags:
            - pattern: "^v.*"
  template:
    metadata:
      name: '{{branch | default(tag) | replace("/", "-")}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/my-org/my-repo.git
        targetRevision: '{{branch | default(tag)}}'
        path: manifests/
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{branch | default(tag) | lower | replace("/", "-")}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
